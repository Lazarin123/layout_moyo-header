<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width user-scalable=no, initial-scale=1.0, maximum-scale=1.0,minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <a
        href="#"
        class="header_logo"
      >
        <img
          src="images/logo.png"
          alt="Logo MOYO"
        />
      </a>

      <nav class="header_nav">
        <ul>
          <li>
            <a
              class="nav_link is-active"
              href="#"
            >
              APPLE
            </a>
          </li>
          <li>
            <a
              class="nav_link"
              href="#"
            >
              SAMSUNG
            </a>
          </li>
          <li>
            <a
              class="nav_link"
              href="#"
            >
              SMARTPHONES
            </a>
          </li>
          <li>
            <a
              class="nav_link laptops"
              data-qa="hover"
              href="#"
            >
              LAPTOPS & COMPUTERS
            </a>
          </li>
          <li>
            <a
              class="nav_link"
              href="#"
            >
              GADGETS
            </a>
          </li>
          <li>
            <a
              class="nav_link"
              href="#"
            >
              TABLETS
            </a>
          </li>
          <li>
            <a
              class="nav_link"
              href="#"
            >
              PHOTO
            </a>
          </li>
          <li>
            <a
              class="nav_link"
              href="#"
            >
              VIDEO
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <h1>Moyo header</h1>
  </body>
</html>
